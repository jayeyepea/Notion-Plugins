<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My Rotating Quotes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;1,400&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Libre Baskerville',Georgia,serif}body{background:transparent;color:#633c79}.wrap{min-height:180px;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px 36px;border:1px solid #f2d3e3;border-radius:16px;background:#FFEAF3}.inner{max-width:680px;transition:opacity .6s ease}.quote{font-size:clamp(19px,3.2vw,28px);line-height:1.5;font-style:italic;font-weight:400;letter-spacing:.015em;color:#A84D86}.author{margin-top:14px;font:13px/1.4 'Libre Baskerville',Georgia,serif;color:#B97A9D}.dots{display:flex;gap:7px;justify-content:center;margin-top:18px}.dot{width:5px;height:5px;background:#A84D86;border-radius:50%;opacity:.25}.dot.active{opacity:1}@media(prefers-reduced-motion:reduce){.inner{transition:none}}
</style></head><body><main class="wrap"><div class="inner" id="inner"><div class="quote" id="quote"></div><div class="author" id="author"></div><div class="dots" id="dots" aria-hidden="true"></div></div></main>
<script>
// EDIT YOUR COLLECTION HERE. Keep quotation marks and commas as shown.
const quotes = [
  { text: "“I’m smart enough now to know I’m stupid. That’s progress.", author: "Andy Weir, Project Hail Mary" },
  { text: "A good plan today is better than a perfect plan tomorrow. Don't wait for an inspired ending to come to mind. Work your way to the ending and see what comes up.", author: "Andy Weir" },
  { text: "Jake: 'Bring me four fried chickens, and a Coke.' Mrs. Murphy: 'You want chicken wings, or chicken legs?' Jake: 'Four fried chickens, and a Coke.' Elwood: 'And some dry white toast, please.'", author: "The Blues Brothers (1980)" },
  { text: "They say that the best blaze burns brightest when circumstances are at their worst.", author: "Howl's Moving Castle (2004)" },
  { text: "One can never have enough socks.", author: "J. K. Rowling, writing as Dumbledore" },
  { text: "Time you enjoy wasting was not wasted.", author: "John Lennon" },
  { text: "I love the idea that people hear a song, and it takes them somewhere.", author: "Paul McCartney" },
  { text: "You're braver than you believe, and stronger than you seem.", author: "Pooh's Grand Adventure: The Search for Christopher Robin"},
  { text: "The best way out is always through.", author: "Robert Frost" },
  { text: "Courage is resistance to fear, mastery of fear—not absence of fear.", author: "Mark Twain" }
  
];
const ROTATE_EVERY_SECONDS = 3600; // Rotate every 1 hour.
let current = -1;
const quoteEl=document.getElementById('quote'),authorEl=document.getElementById('author'),inner=document.getElementById('inner'),dots=document.getElementById('dots');
function showNext(){if(!quotes.length){quoteEl.textContent='Add your first quote to the quotes array.';authorEl.textContent='';return;}let next=current;if(quotes.length>1){while(next===current)next=Math.floor(Math.random()*quotes.length)}else next=0;inner.style.opacity='0';setTimeout(()=>{current=next;quoteEl.textContent='“'+quotes[current].text+'”';authorEl.textContent=quotes[current].author?'— '+quotes[current].author:'';dots.replaceChildren();if(quotes.length<=12){quotes.forEach((_,i)=>{const d=document.createElement('span');d.className='dot'+(i===current?' active':'');dots.append(d)})}inner.style.opacity='1'},350)}
showNext();setInterval(showNext,Math.max(5,ROTATE_EVERY_SECONDS)*1000);
</script></body></html>
